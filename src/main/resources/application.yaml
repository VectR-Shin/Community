server:
  port: 8081

spring:
  application:
    name: community


  datasource:
    url: jdbc:mysql://localhost:3306/community_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"

  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        ddl-auto: validate
    open-in-view: false

  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: community-backend
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/community

  messages:
    basename: exception.validation-messages
    encoding: UTF-8

  # 정책 파일 불러오기
  config:
    import: classpath:policies/member-policy.yaml

logging:
  level:
    org:
      springframework:
        security=DEBUG:

keycloak:
  admin:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8080}
    realm: ${KEYCLOAK_REALM:community}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:community-admin}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}

community:
  security:
    hmac:
      key: ${COMMUNITY_HMAC_KEY}

  frontend:
      url: ${FRONTEND_URL:http://localhost:8081}